name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /local-data-sanitizer/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is still set to "Deploy from a branch", GitHub rebuilds the
      # repo root after this workflow finishes and serves index.html verbatim
      # (which points at /src/main.jsx) - a blank page. Pinning the source to
      # Actions keeps the published dist/ artifact live.
      - name: Point Pages at GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --jq '.build_type'

      - id: deployment
        uses: actions/deploy-pages@v4
