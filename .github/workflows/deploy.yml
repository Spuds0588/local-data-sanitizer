name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The bundle-cache commit below must not start another build.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /local-data-sanitizer/
          VITE_STABLE_NAMES: '1'

      # GitHub Pages may still be set to "Deploy from a branch", in which case
      # GitHub publishes the repo root verbatim after this job. The raw
      # index.html has no bundler, so it falls back to assets/app.js; keep that
      # bundle current in the branch.
      - name: Cache the branch build for GitHub Pages
        run: |
          rm -rf assets
          cp -r dist/assets assets
          git add -A assets
          if git diff --cached --quiet; then
            echo "Branch bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the branch bundle for GitHub Pages [skip ci]"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
