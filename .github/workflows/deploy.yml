name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /local-data-sanitizer/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is still set to "Deploy from a branch", GitHub rebuilds the
      # repo root after this workflow finishes and serves index.html verbatim
      # (which points at /src/main.jsx) - a blank page. Pinning the source to
      # Actions keeps the published dist/ artifact live. This is best effort:
      # the API call needs repository admin, which GITHUB_TOKEN may not have.
      - name: Point Pages at GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --jq '.build_type'; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Could not switch Pages to Actions. Set Settings -> Pages -> Source to GitHub Actions."
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check the live page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # Give a branch build triggered by this same push time to land, so a
          # regression is visible in the run instead of a minute later.
          sleep 60
          html=$(curl -fsSL "$PAGE_URL")
          if printf '%s' "$html" | grep -q '/src/main.jsx'; then
            echo "::warning::$PAGE_URL is serving the branch root, not this deployment. Set Settings -> Pages -> Source to GitHub Actions."
            exit 1
          fi
          echo "$PAGE_URL serves the bundled build."
